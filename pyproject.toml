[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "book-monitor"
version = "0.1.0"
description = "Local evidence-based book monitoring service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "httpx>=0.28,<1",
  "beautifulsoup4>=4.13,<5", "openpyxl>=3.1,<4", "rapidfuzz>=3.12,<4",
  "pypdf>=6,<7", "playwright>=1.58,<2", "python-multipart>=0.0.20,<1",
  "pydantic-settings>=2.8,<3"
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=1"]

[project.scripts]
book-monitor = "monitor.cli:main"

[tool.setuptools.packages.find]
include = ["monitor*"]

[tool.setuptools.package-data]
monitor = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
